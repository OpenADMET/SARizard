# Environment for the finetune and analyze stages, which drive the openadmet-models CLI.
# openadmet-models declares no runtime deps in its pyproject, so its dependency stack lives
# here. This is a mirror of openadmet-models/devtools/conda-envs/openadmet-models-gpu.yaml
# (the GPU variant, since finetuning runs on GPU nodes); keep it in sync when that file changes.
# This stack (pandas 2.x, torch 2.7, Python 3.12) conflicts with the main env, so it is separate.
# setup.sh builds it if missing and installs openadmet-models and this repo editable into it.
name: openadmet
channels:
  - conda-forge
dependencies:
  - ase
  - boto3
  - catboost
  - chemprop >= 2.1.1
  - codecov
  - datamol
  - h5py
  - hyperopt
  - intake
  - intake-parquet
  - joblib
  - jupyterlab
  - lightgbm
  - loguru
  - matplotlib
  - mdanalysis
  - modal
  - mordredcommunity
  - numpy
  - pandas
  - pip
  - python >= 3.12,<3.14
  - pytorch-gpu
  - pytorch-lightning<=2.6.1
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-xdist
  - rdkit
  - rich
  - scikit-learn
  - seaborn
  - splito
  - statsmodels
  # - tabpfn
  - tabulate
  - umap-learn
  - uncertainty-toolbox
  - xgboost
  - zarr >=3.0.0
  - pip:
    - email-validator
    - phx-class-registry
    - tabpfn-extensions
    - git+https://github.com/PriorLabs/TabPFN.git@main
    - git+https://github.com/JacksonBurns/neural-pairwise-regression.git
    - git+https://github.com/OpenADMET/molfeat.git@main
    - git+https://github.com/PatWalters/useful_rdkit_utils.git@master
    - setuptools <82.0.0
    - wandb < 0.26.0
