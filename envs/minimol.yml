# Isolated environment for the minimol embedding target. minimol pins graphium==2.4.7,
# which drags a fixed torch 2.3 / PyG stack and torchmetrics<0.11 that conflict with the
# training env; quarantine it here. Writes cache/targets/minimol/target.npy (numpy only);
# pack to zarr in the sarizard env.
#
# The PyG C++ extensions (torch-scatter, torch-sparse, torch-cluster) must be installed
# from wheels matching the resolved torch + CUDA build, per the minimol README; add them
# after creating this env. Runs on CPU or CUDA (no Graphcore IPU needed).
#
#   conda activate sarizard-minimol
#   python -m pretraining.features.compute_target --flavor minimol
name: sarizard-minimol
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - rdkit>=2024.03
  - "numpy<2"  # graphium 2.4.7 stack is numpy 1.x
  - pyarrow>=15
  - pip:
      - minimol==1.3.5
