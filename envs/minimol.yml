# Isolated environment for the minimol embedding target. minimol pulls graphium==2.4.7,
# which drags torch 2.3 plus the PyG C++ extensions (torch-scatter/sparse/cluster). Those
# have no workable build-from-source path under pip isolation, so they must come from PyG's
# prebuilt wheels via the --find-links index below. setuptools is pinned <80 because minimol
# imports pkg_resources, which setuptools removed in 81. Writes
# cache/targets/minimol/target.npy (numpy only); pack to zarr in the sarizard env.
#
# Runs on CPU or CUDA (no Graphcore IPU). The find-links below is the CPU build, which is
# portable (linux and macOS arm64). For cluster GPU, switch it to the matching CUDA index,
# e.g. https://data.pyg.org/whl/torch-2.3.0+cu124.html, and let torch resolve to the cu build.
#
#   conda env create -f envs/minimol.yml
#   conda activate sarizard-minimol
#   python -m sarizard.pretraining.features.compute_target --flavor minimol
name: sarizard-minimol
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - "setuptools<80"   # minimol imports pkg_resources, removed in setuptools 81
  - rdkit>=2024.03
  - "numpy<2"  # graphium 2.4.7 stack is numpy 1.x
  - pyarrow>=15
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.3.0+cpu.html
      - torch==2.3.*
      - torch-scatter
      - torch-sparse
      - torch-cluster
      - minimol==1.3.5
