# Isolated environment for the osmordred target calculator. osmordred is a compiled
# extension; it is quarantined here so its build never perturbs the training stack.
# Writes cache/targets/osmordred/target.npy (numpy only); pack to zarr in the sarizard env.
#
# Run from the repo root so `python -m` puts it on the path:
#   conda activate sarizard-osmordred
#   python -m pretraining.features.compute_target --flavor osmordred
name: sarizard-osmordred
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - rdkit>=2024.03
  - numpy>=1.26
  - pyarrow>=15
  - pip:
      - osmordred
