# Main conda environment: foundation pretraining, openadmet finetuning, the
# direct-compute descriptor targets (RDKit and scikit-fingerprints), target packing,
# and the analysis package. Three target generators with conflicting stacks live in
# isolated environments (envs/osmordred.yml, envs/jazzy.yml, envs/minimol.yml,
# envs/mlqm.yml); see AGENTS.md.
#
# PyTorch is intentionally left to a cluster-specific install: pick the build
# matching the node CUDA with `conda install pytorch pytorch-cuda=<ver> -c pytorch
# -c nvidia` (or the cluster module), then create this env on top.
name: sarizard
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # training stack
  - pytorch>=2.2
  - lightning>=2.2
  - zarr>=3.0
  - polars>=1.0
  # cheminformatics and direct-compute targets
  - rdkit>=2024.03
  # scientific and analysis stack
  - numpy>=2
  - pandas>=2
  - pyarrow>=15
  - scikit-learn>=1.5
  - scipy>=1.12
  - matplotlib>=3.8
  - lightgbm>=4.3
  - pyyaml>=6.0
  - pip:
      - "chemprop>=2.2.3"
      - "scikit-fingerprints>=2.0"
      # lightning's TensorBoardLogger (train.py) needs tensorboard; lightning does not pull it in
      - "tensorboard>=2.15"
      # install the local checkouts editable after the env is created:
      #   pip install -e ../openadmet-models
      #   pip install -e .
