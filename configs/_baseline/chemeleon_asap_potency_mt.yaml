data:
  train_resource: data/splits/asap_potency_train.csv
  val_resource: data/splits/asap_potency_val.csv
  test_resource: data/splits/asap_potency_test.csv
  type: intake
  input_col: OPENADMET_CANONICAL_SMILES
  target_cols:
  - pIC50_MERS_Mpro
  - pIC50_SARS2_Mpro
  # MERS 87%/100% train/test, SARS-CoV-2 82%/89%; sparse masking retains all rows
  dropna: false

metadata:
  authors: Sean Colby
  email: seanmcolby@gmail.com
  biotargets:
  - MERS-CoV_Mpro
  - SARS-CoV-2_Mpro
  build_number: 0
  description: Multitask CheMeleon regression for MERS-CoV and SARS-CoV-2 main protease inhibitor potency (ASAP discovery set, predefined split)
  driver: pytorch
  name: chemeleon_asap_potency_mt
  tag: chemeleon-asap-potency-mt
  tags:
  - openadmet
  - chemeleon
  - potency
  - pic50
  - mpro
  - mers
  - sars-cov-2
  - antiviral
  - multitask
  - asap
  version: v1

procedure:
  random_seed: 42

  feat:
    type: ChemPropFeaturizer
    params:
      batch_size: 128
      normalize_targets: true
      n_jobs: 4
      shuffle: true
      random_seed: 42

  model:
    type: ChemPropModel
    params:
      random_seed: 42
      ffn_hidden_dim: 1024
      ffn_num_layers: 3
      mpnn_lr: 1.0e-3
      ffn_lr: 1.0e-3
      mpnn_weight_decay: 0
      ffn_weight_decay: 1.0e-4
      dropout: 0.1
      batch_norm: false
      scheduler: plateau
      reduce_lr_patience: 5
      reduce_lr_factor: 0.5
      n_tasks: 2
      from_foundation: chemeleon

  # split block required by schema; bypassed at runtime when train/val/test resources are set
  split:
    type: ClusterSplitter
    params:
      method: butina
      butina_cutoff: 0.65
      random_seed: 42
      train_size: 0.7
      val_size: 0.1
      test_size: 0.2

  train:
    type: LightningTrainer
    params:
      accelerator: mps
      monitor_metric: val_loss
      gradient_clip_val: 0.5
      early_stopping: true
      early_stopping_patience: 20
      early_stopping_mode: min
      early_stopping_min_delta: 0.001
      max_epochs: 100
      use_wandb: false
      wandb_project: openadmet

report:
  eval:
  - type: RegressionMetrics
    params: {}
