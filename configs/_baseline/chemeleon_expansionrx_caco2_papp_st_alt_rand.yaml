data:
  train_resource: data/splits/expansionrx_train_rand.csv
  val_resource: data/splits/expansionrx_val_rand.csv
  test_resource: data/splits/expansionrx_test.csv
  type: intake
  input_col: OPENADMET_CANONICAL_SMILES
  target_cols:
  - LOG_CACO2_PAPP
  dropna: true

metadata:
  authors: Sean Colby
  email: seanmcolby@gmail.com
  biotargets:
  - Caco2_Papp
  build_number: 0
  description: Single-task CheMeleon regression for Caco-2 permeability Papp A>B (ExpansionRx challenge dataset, predefined split, random val, alt hyperparams)
  driver: pytorch
  name: chemeleon_expansionrx_caco2_papp_st_alt_rand
  tag: chemeleon-expansionrx-caco2-papp-st-alt-rand
  tags:
  - openadmet
  - chemeleon
  - caco2
  - permeability
  - singletask
  - expansionrx
  - alt
  - rand
  version: v1

procedure:
  random_seed: 42

  feat:
    type: ChemPropFeaturizer
    params:
      batch_size: 128
      normalize_targets: true
      n_jobs: 4
      shuffle: true
      random_seed: 42

  model:
    type: ChemPropModel
    params:
      random_seed: 42
      ffn_hidden_dim: 512
      ffn_num_layers: 3
      mpnn_lr: 1.0e-4
      ffn_lr: 1.0e-3
      mpnn_weight_decay: 0
      ffn_weight_decay: 1.0e-4
      dropout: 0.25
      batch_norm: false
      scheduler: plateau
      reduce_lr_patience: 5
      reduce_lr_factor: 0.5
      n_tasks: 1
      from_foundation: chemeleon

  # split block required by schema; bypassed at runtime when train/val/test resources are set
  split:
    type: ClusterSplitter
    params:
      method: butina
      butina_cutoff: 0.65
      random_seed: 42
      train_size: 0.7
      val_size: 0.1
      test_size: 0.2

  train:
    type: LightningTrainer
    params:
      accelerator: mps
      monitor_metric: val_loss
      gradient_clip_val: 0.5
      early_stopping: true
      early_stopping_patience: 20
      early_stopping_mode: min
      early_stopping_min_delta: 0.001
      max_epochs: 100
      use_wandb: false
      wandb_project: openadmet

report:
  eval:
  - type: RegressionMetrics
    params: {}
